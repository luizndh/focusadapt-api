services:
  postgres:
    env_file:
      - .env.prod
    image: postgres:16-alpine
    container_name: focusadapt-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - focusadapt-network

  api:
    env_file:
      - .env.prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: focusadapt-api-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BADGE_ICONS_PATH: /app/badge-icons/
    volumes:
      - /home/luiz/focusadapt/badge-icons:/app/badge-icons:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - focusadapt-network
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: focusadapt-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
    - focusadapt-network

volumes:
  pgdata_prod:
    name: focusadapt_postgres_prod

networks:
  focusadapt-network:
    driver: bridge
