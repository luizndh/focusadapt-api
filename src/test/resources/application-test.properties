# ===================================================================
# FocusAdapt API Test Configuration
# ===================================================================



# In-Memory H2 Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Docker Compose auto-configuration during tests
spring.docker.compose.enabled=false

# Do not initialize from schema.sql in tests (use ddl-auto=create-drop)
spring.sql.init.mode=never
