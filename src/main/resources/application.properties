# ===================================================================
# FocusAdapt API - Base Configuration
# ===================================================================

# Profile Settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Application Metadata
spring.application.name=focus-adapt-api
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Connection Settings
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:focusadapt}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Common Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson Mapping Formats
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# JWT Configurations (HS256 secret must be at least 256 bits)
security.jwt.secret-key=${JWT_SECRET_KEY:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLWtleS1mb3ItamR3dC1zaWduaW5nLWZvY3VzcGF0aC1hcGk=}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Gemini API Integration Properties
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/interactions
gemini.model=gemini-3.1-flash-lite
gemini.timeout-ms=30000
gemini.max-retries=3
gemini.rate-limit-rpm=15
