# ===================================================================
# FocusAdapt API - Development Profile
# ===================================================================

# Hibernate Auto DDL (Auto creation/updates for fast dev loops)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Initialize seed data from schema.sql
spring.sql.init.mode=always

# Springdoc OpenAPI (Swagger) Configurations
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Actuator Configs (Full exposure in dev for debugging)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configurations for Terminal Tracing
logging.level.root=INFO
logging.level.com.focus.adapt.api=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
