# ===================================================================
# FocusAdapt API - Development Profile
# ===================================================================

# Hibernate Auto DDL (Auto creation/updates for fast dev loops)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Do not initialize from schema.sql in dev (rely on ddl-auto=update)
spring.sql.init.mode=never

# Springdoc OpenAPI (Swagger) Configurations
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Actuator Configs (Full exposure in dev for debugging)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
