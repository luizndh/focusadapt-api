# ===================================================================
# FocusAdapt API - Production Profile
# ===================================================================

# JPA Production Rules (No auto schema modifications, only validation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Initialize database schema from schema.sql
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Disable Swagger / OpenAPI Sandbox in production to prevent probing
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator & Metrics Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.access=read-only

# Require JWT Secret Key to be passed as environment variable (no fallback)
security.jwt.secret-key=${JWT_SECRET_KEY}
